<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Temperatura média </title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 30px;
      text-align: center;
    }

    h1 {
      margin-bottom: 40px;
      font-size: 24px;
    }

    .chart-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 20px;
    }

    .chart-box {
      width: 45%;
      min-width: 300px;
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    canvas {
      width: 100%;
      height: auto;
    }

    @media (max-width: 768px) {
      .chart-box {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <h1>Temperatura média</h1>
  <div class="chart-container">
    <div class="chart-box">
      <canvas id="linhaChart"></canvas>
    </div>
    <div class="chart-box">
      <canvas id="barraChart"></canvas>
    </div>
  </div>

  <script>
    const linhaCanvas = linhaChart;
    const barraCanvas = barraChart;

    const linha = new Chart(linhaCanvas, {
      type: 'line',
      data: {
        labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
        datasets: [
          {
            label: 'Temperatura',
            data: [30, 29, 28, 25, 22, 23],
            borderColor: 'deeppink',
            backgroundColor: 'deeppink',
            tension: 0.4
          },
          {
            label: 'Umidade',
            data: [80, 82, 80, 85, 80, 83],
            borderColor: 'dodgerblue',
            backgroundColor: 'dodgerblue',
            tension: 0.4
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { position: 'top' }
        }
      }
    });

    const barras = new Chart(barraCanvas, {
      type: 'bar',
      data: {
        labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],
        datasets: [
          {
            label: 'Temperatura Média',
            data: [22, 24, 27, 23, 20, 18],
            backgroundColor: 'deeppink'
          },
          {
            label: 'Umidade Média',
            data: [90, 89, 93, 87, 88, 82],
            backgroundColor: 'dodgerblue'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { position: 'top' }
        }
      }
    });
  </script>
</body>
</html>
